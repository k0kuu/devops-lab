
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  APP_VERSION: v1
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: migrate
          image: devops-api:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "migrate.py"]
          envFrom:
            - secretRef:
                name: db-secret
      containers:
        - name: api
          image: devops-api:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: db-secret
            - configMapRef:
                name: api-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
